; Polybar config adapted for a ThinkPad T410.
; Based on Keyitdev dotfiles v3 (GPL-3.0) https://github.com/Keyitdev/dotfiles
; Changes: no mpd, PipeWire volume, tray module, slower refresh, auto-detected battery/wifi/backlight.

[global/wm]
margin-bottom = 0
margin-top = 0
fixed-center = true
include-file = $HOME/.config/polybar/colors.ini

[settings]
screenchange-reload = true
pseudo-transparency = true
compositing-background = source
compositing-foreground = over
compositing-overline = over
compositing-underline = over
compositing-border = over

[bar/main]
modules-left = right1 i3 left1 sep right1 network left1
modules-center = right1 date left1
modules-right = right1 temperature sep2 sep2 cpu sep2 sep2 memory left1 sep right1 backlight sep2 sep2 pulseaudio left1 sep right1 battery left1 sep tray
separator = 
monitor = 
monitor-fallback = 
monitor-strict = false
override-redirect = false
wm-name = 
locale = 
bottom = false
fixed-center = true
padding = 0
width = 100%
height = 28
offset-x = 0%
offset-y = 0%
radius-top = 0
radius-bottom = 0
background = #002d333f
foreground = ${color.foreground}
dim-value = 1.0
line-size = 2
line-color = ${color.background}
border-top-size = 8
border-top-color = #002d333f
border-left-size = 8
border-left-color = #002d333f
border-right-size = 8
border-right-color = #002d333f
font-0 = "Iosevka Nerd Font:size=11;4"
font-1 = "Iosevka Nerd Font:style=Medium:size=16;4"
font-2 = "feather:size=12;5"
enable-ipc = true

[glyph]
gleft = 
gright = 

[module/left1]
type = custom/text
format-background = #002d333f
format-foreground = ${color.background}
format = ${glyph.gleft}
format-font = 2

[module/right1]
type = custom/text
format-background = #002d333f
format-foreground = ${color.background}
format = ${glyph.gright}
format-font = 2

[module/sep]
type = custom/text
format = " "

[module/sep2]
type = custom/text
format = " "
format-foreground = ${color.background}
format-background = ${color.background}

[module/backlight]
type = internal/backlight
card = __BACKLIGHT__
enable-scroll = true
format = <ramp> <label>
format-background = ${color.background}
label = %percentage%%
ramp-0 = 
ramp-1 = 
ramp-foreground = ${color.yellow}

[module/battery]
type = internal/battery
poll-interval = 10
battery = __BAT__
adapter = __ADP__
full-at = 99
time-format = %H:%M
format-charging = <label-charging>
format-charging-prefix = ""
format-charging-prefix-foreground = ${color.green}
format-charging-prefix-background = ${color.background}
format-discharging = <label-discharging>
format-discharging-prefix = ""
format-discharging-prefix-foreground = ${color.pink}
format-discharging-prefix-background = ${color.background}
format-full = <label-full>
format-full-prefix = 
format-full-prefix-foreground = ${color.red}
format-full-prefix-background = ${color.background}
label-charging = " %percentage%%"
label-charging-background = ${color.background}
label-discharging = " %percentage%%"
label-discharging-background = ${color.background}
label-full = " Full"
label-full-background = ${color.background}

[module/cpu]
type = internal/cpu
interval = 3
format = <label>
format-prefix = 
format-prefix-foreground = ${color.green}
format-background = ${color.background}
label = " %percentage%%"

[module/date]
type = internal/date
interval = 5
date = %a %d %b
time = %H:%M
date-alt = %A %d %B %Y
time-alt = %H:%M:%S
format = <label>
format-prefix = " "
format-prefix-foreground = ${color.red}
format-background = ${color.background}
label = %date% %time%

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
fixed-values = true
format-mounted = <label-mounted>
format-mounted-prefix = 
format-mounted-prefix-foreground = ${color.orange}
format-mounted-background = ${color.background}
format-unmounted = <label-unmounted>
format-unmounted-prefix = 
format-unmounted-prefix-foreground = ${color.red}
format-unmounted-background = ${color.background}
label-mounted = " %free%"
label-unmounted = " %mountpoint%: NA"

[module/i3]
type = internal/i3
pin-workspaces = true
ws-icon-0 = 1;
ws-icon-1 = 2;
ws-icon-2 = 3;
ws-icon-3 = 4;
ws-icon-4 = 5;
ws-icon-5 = 6;
ws-icon-6 = 7;
ws-icon-7 = 8;
ws-icon-8 = 9;
ws-icon-9 = 10;
ws-icon-default = 
format = <label-state><label-mode>
label-mode = %mode%
label-mode-padding = 1
label-mode-background = ${color.background}
label-mode-foreground = ${color.foreground}
label-focused = %icon%
label-focused-foreground = ${color.green}
label-focused-background = ${color.background}
label-focused-underline = ${color.green}
label-focused-padding = 1
label-unfocused = %icon%
label-unfocused-padding = 1
label-unfocused-background = ${color.background}
label-visible = %icon%
label-visible-underline = ${color.purple}
label-visible-padding = 1
label-visible-foreground = ${color.purple}
label-visible-background = ${color.background}
label-urgent = %icon%
label-urgent-foreground = ${color.red}
label-urgent-background = ${color.background}
label-urgent-padding = 1

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-prefix = 
format-prefix-foreground = ${color.purple}
format-background = ${color.background}
label = " %gb_used%"

[module/network]
type = internal/network
interface = __WIFI__
interval = 3
accumulate-stats = true
unknown-as-up = true
format-connected = <label-connected>
format-connected-prefix = 
format-connected-prefix-foreground = ${color.orange}
format-connected-background = ${color.background}
format-connected-padding = 0
format-disconnected = <label-disconnected>
format-disconnected-prefix = 
format-disconnected-prefix-foreground = ${color.red}
format-disconnected-background = ${color.background}
format-disconnected-padding = 0
label-connected = "%{A1:alacritty -e nmtui &:} %essid%%{A}"
label-disconnected = "%{A1:alacritty -e nmtui &:} Offline%{A}"

[module/temperature]
type = internal/temperature
interval = 3
thermal-zone = 0
warn-temperature = 85
units = true
format = <ramp> <label>
format-background = ${color.background}
format-warn = <ramp> <label-warn>
format-warn-background = ${color.background}
label = %temperature-c%
label-warn = "%temperature-c%"
label-warn-foreground = ${color.red}
ramp-0 = 
ramp-1 = 
ramp-2 = 
ramp-3 = 
ramp-4 = 
ramp-foreground = ${color.cyan}

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 4px
tray-background = #002d333f

[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
format-volume = <ramp-volume> <label-volume>
format-volume-background = ${color.background}
format-muted = <label-muted>
format-muted-background = ${color.background}
label-volume = %percentage%%
label-muted = 
label-muted-foreground = ${color.red}
ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${color.blue}
click-right = alacritty -e wpctl status &

